name: Build Android APK - Anomah Chat

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build Android APK (Anomah Chat)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/AnomahChat-v1.0.3.apk
            cp "$APK_PATH" build-output/AnomahChat.apk
            cp "$APK_PATH" build-output/Anomah-Chat-vMahi-A03.apk
            echo "Successfully prepared APK from: $APK_PATH"
          else
            echo "::error::No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnomahChat-v1.0.3-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: Anomah Chat v1.0.3 (Mahi A03 Release)
          body: |
            ## Anomah Chat Android APK v1.0.3 (Mahi A03)
            Direct installation package for Android devices.
            - In-App Auto-Update & Auto-Install Support
            - Post-Install Automatic Cache Cleanup
            - Realtime Voice & Video Calls
            - High-Speed WebRTC & Messaging
          draft: false
          prerelease: false
          files: |
            build-output/AnomahChat-v1.0.3.apk
            build-output/AnomahChat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
