name: Build Android APK - Anomah Chat

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Build Android APK (Anomah Chat)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK (or Debug fallback)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            export ANDROID_KEYSTORE_PATH="$(pwd)/release-keystore.jks"
            ./gradlew assembleRelease --no-daemon
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not configured; building debug APK as fallback. Add GitHub Release Keystore Secrets for consistent signature updates."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f android/release-keystore.jks

      - name: Prepare APK Output & Compute SHA-256
        id: apk
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" build-output/AnomahChat-v1.0.6.apk
            cp "$APK_PATH" build-output/AnomahChat.apk
            cp "$APK_PATH" build-output/Anomah-Chat-vMahi-A06.apk
            SHA256=$(sha256sum build-output/AnomahChat.apk | awk '{print $1}')
            echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
            echo "Prepared APK from $APK_PATH (SHA-256: $SHA256)"
          else
            echo "::error::No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnomahChat-v1.0.6-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.6
          name: Anomah Chat v1.0.6 (Mahi A06 Release)
          body: |
            ## Anomah Chat Android APK v1.0.6 (Mahi A06)
            Direct installation package for Android devices.
            - Hardened Zero-Trust Firestore Security Rules & Owner-Only PII Protection
            - Signed Release APK Pipeline + Native SHA-256 Checksum Verification
            - Client-Side Salted SHA-256 Quick App-Lock PIN
            - Realtime Voice Notes, Media Sharing & Calling

            SHA-256: `${{ steps.apk.outputs.sha256 }}`
          draft: false
          prerelease: false
          files: |
            build-output/AnomahChat-v1.0.6.apk
            build-output/AnomahChat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
